title: Studio Journal
description: A reusable static publishing starter.
author: Nick
url: "https://madtinker.net"
baseurl: ""
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
timezone: America/New_York
plugins:
  - jekyll-feed
  - jekyll-seo-tag
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - imports
  - _imports
  - worker
  - admin/README.md

# Review-only imported teaching archive; not part of site.posts.
collections:
  pages:
    output: true
  nuggetofjoy:
    output: true
    permalink: /teaching/:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Nick
  - scope:
      path: ""
      type: nuggetofjoy
    values:
      layout: teaching-post
      author: Nick
