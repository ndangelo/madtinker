title: Studio Journal
description: A reusable static publishing starter.
author: Nick
url: "https://madtinker.net"
baseurl: ""
markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
timezone: America/New_York
plugins:
  - jekyll-feed
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Nick
collections:
  pages:
    output: true
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - worker
  - admin/README.md
