name: Build Nugget of Joy Jekyll preview
on:
  workflow_dispatch:
  push:
    branches: [nuggetofjoy-import]
    paths:
      - '.github/workflows/publish-nuggetofjoy-preview.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuggetofjoy-import
      - name: Copy imported Markdown to Jekyll draft preview collection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          source=Path('_imports/nuggetofjoy/markdown')
          target=Path('_nuggetofjoy')
          target.mkdir(exist_ok=True)
          files=list(source.glob('*.md'))
          assert len(files)==382, f'Expected 382 Markdown files, got {len(files)}'
          for src in files:
              # Preserve manually repaired lessons and avoid overwriting reviewed content.
              if target.joinpath(src.name).exists():
                  continue
              body=src.read_text()
              # Modernize links to the original WordPress media host.
              body=re.sub(r'http://(www[.])?nuggetofjoy[.]com/wp-content/', 'https://nuggetofjoy.com/wp-content/', body, flags=re.I)
              assert 'http://nuggetofjoy.com/wp-content/' not in body.lower(), src.name
              # Keep source metadata; add Jekyll layout and a safe, isolated permalink.
              body=body.replace('---\n', '---\nlayout: teaching-post\n', 1)
              body=re.sub(r'(?m)^migration:\s*\n(?:  .+\n)+', '', body)
              # Only bypass Markdown for posts whose entire body is already HTML.
              # Mixed HTML/Markdown requires a separate parser; do not blindly wrap it.
              parts=body.split('---\n', 2)
              if len(parts)==3:
                  content=parts[2]
                  lines=[line.strip() for line in content.splitlines() if line.strip()]
                  has_markdown=any(re.match(r'^(#{1,6}\\s|[-*+]\\s|\\d+[.]\\s|\x60{3}|>\\s)', line) for line in lines)
                  if lines and not has_markdown and lines[0].startswith('<') and '{::nomarkdown}' not in content:
                      body=parts[0]+'---\n'+parts[1]+'---\n\n{::nomarkdown}\n'+content.strip()+'\n{:/nomarkdown}\n'
              target.joinpath(src.name).write_text(body)
          css_source=Path('_imports/nuggetofjoy/styles/posts')
          css_target=Path('assets/css/imported-posts')
          css_target.mkdir(parents=True,exist_ok=True)
          for css in css_source.glob('*.css'):
              shutil.copy2(css,css_target/css.name)
          print(f'Prepared {len(files)} posts and {len(list(css_source.glob("*.css")))} post-specific stylesheets')
          PY
      - name: Commit preview collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _nuggetofjoy assets/css/imported-posts
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Nugget of Joy preview collection"
            git pull --rebase origin nuggetofjoy-import
            git push origin HEAD:nuggetofjoy-import
          fi
