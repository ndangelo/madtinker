name: Audit teaching CSS scopes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_nuggetofjoy/**'
      - 'assets/css/imported-posts/**'
      - 'scripts/audit_teaching_css.py'
      - '.github/workflows/audit-teaching-css.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit imported CSS scope IDs
        run: python3 scripts/audit_teaching_css.py
      - name: Upload full audit
        uses: actions/upload-artifact@v4
        with:
          name: teaching-css-audit
          path: audit-results/
