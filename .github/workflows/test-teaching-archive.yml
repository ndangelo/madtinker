name: Test teaching archive Jekyll build
on:
  push:
    branches: [main, nuggetofjoy-import]
    paths:
      - '_config.yml'
      - '_nuggetofjoy/**'
      - '_layouts/**'
      - 'assets/css/imported-posts/**'
      - 'assets/css/teaching-archive.css'
      - 'teaching.html'
      - '.github/workflows/test-teaching-archive.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site
      - name: Validate teaching archive output
        run: |
          test -f _site/teaching/index.html
          python3 - <<'PY'
          from pathlib import Path
          posts=list(Path('_site/teaching').glob('*/index.html'))
          print('Rendered teaching posts:',len(posts))
          assert len(posts)==382, f'Expected 382, got {len(posts)}'
          css=list(Path('_site/assets/css/imported-posts').glob('*.css'))
          print('Original post CSS files:',len(css))
          assert len(css)==52, f'Expected 52 CSS files, got {len(css)}'
          assert Path('_site/assets/css/teaching-archive.css').exists()
          lesson=Path('_site/teaching/2026-10-27-68303-2-68303/index.html')
          assert lesson.exists(), 'Gradients lesson URL missing'
          html=lesson.read_text()
          assert '<h2>CSS Gradients Part 2</h2>' in html, 'Lesson heading not rendered as HTML'
          assert '<h2>01 / Start Here</h2>' in html, 'Lesson section heading missing'
          assert 'MADTINKERBLOCKTOKEN' not in html, 'Unresolved import placeholder'
          assert 'gradient-part-two' in html, 'Lesson wrapper class missing'
          assert 'imported-posts/68303.css' in html, 'Lesson CSS link missing'
          assert 'gp-reference' in html, 'Gradient reference table missing'
          assert Path('_site/assets/css/imported-posts/68303.css').exists(), 'Gradient stylesheet missing'
          print('Gradient lesson HTML and stylesheet checks passed')
          campaign=Path('_site/teaching/2026-10-26-amde-477-from-brand-awareness-to-campaign-action-68273/index.html')
          assert campaign.exists(), 'AMDE 477 campaign page missing'
          campaign_html=campaign.read_text()
          assert 'id="amde477-campaign-guide"' in campaign_html, 'Campaign CSS scope missing'
          assert '<h1>From Brand Awareness to Campaign Action</h1>' in campaign_html, 'Campaign heading missing'
          assert 'imported-posts/68273.css' in campaign_html, 'Campaign CSS link missing'
          assert Path('_site/assets/css/imported-posts/68273.css').exists(), 'Campaign stylesheet missing'
          assert '{::nomarkdown}' not in campaign_html, 'Raw preservation marker leaked into HTML'
          print('AMDE 477 campaign HTML and stylesheet checks passed')
          PY
