<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102e52">
  {% if page.layout == 'teaching-post' %}
  <meta name="description" content="{{ page.description | default: page.title | strip_html | escape }} — MadTinker teaching archive">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: page.title | strip_html | escape }} — MadTinker teaching archive">
  <meta property="og:type" content="article">
  {% else %}
  {% seo %}
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>
  <main id="main" class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>© {{ site.time | date: "%Y" }} {{ site.author | default: site.title }}.</p>
    <p>Published as a lightweight static website.</p>
  </footer>
</body>
</html>
